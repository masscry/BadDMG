plugins {
    id 'com.android.application'
}

// SDL's Java glue comes from the deps/SDL submodule, pinned by the parent
// repository. Run `git submodule update --init --recursive` before building.
def sdlJavaDir = file('../../deps/SDL/android-project/app/src/main/java')

def abiFilter = project.findProperty('abi')

android {
    namespace 'space.deci.baddmg'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'space.deci.baddmg'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '0.3'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-26'
                if (abiFilter) {
                    abiFilters abiFilter
                } else {
                    abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '4.1.2'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDir(sdlJavaDir)
        }
    }

    lint {
        abortOnError = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
