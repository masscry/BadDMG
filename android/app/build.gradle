plugins {
    id 'com.android.application'
}

def abiFilter = project.findProperty('abi')

android {
    namespace 'org.baddmg.baddmg'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'org.baddmg.baddmg'
        minSdk 21
        targetSdk 37
        versionCode 1
        versionName '0.2'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
                if (abiFilter) {
                    abiFilters abiFilter
                } else {
                    abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '4.1.2'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
    }
}
